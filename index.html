body{width:auto!important;padding:0!important;margin:0;background:#eef0f3}
[data-act]{cursor:pointer;user-select:none}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:#fff;border-bottom:1px solid #e4e6ea;position:sticky;top:0;z-index:5;flex-wrap:wrap}

.panel h3{font-size:16px}

.steps li.done{color:#9aa0a6}.steps li.done .sn{background:#e3f7ea;color:#1f9d55}
.steps li.cur{background:#e3f4fd;color:#111;font-weight:600}.steps li.cur .sn{background:#2AABEE;color:#fff}
.hint{margin-top:10px;background:#fff8e6;border:1px solid #f6dfa4;border-radius:12px;padding:10px;font-size:13px;line-height:1.4}

.sm{font-size:12.5px}

.chatin{flex:1;border:none;border-radius:18px;background:#f1f3f6;padding:8px 12px;font:inherit;font-size:14px;outline:none;min-width:0}
.sendb{color:#2AABEE;font-size:20px}
textarea.cmt{width:100%;resize:none;font:inherit;font-size:13px;outline:none}

.who span{cursor:pointer}
.stabs{display:flex;gap:4px;border-bottom:1px solid #e3e6ea}

.stabs .dot{position:absolute;top:4px;right:3px;width:7px;height:7px;border-radius:50%;background:#1f9d55}
.sheetwrap{overflow:auto;max-height:690px;margin-top:8px}
.sheetwrap table{border-collapse:collapse;font-size:11.5px;width:100%;font-family:Arial,sans-serif}

.toastg.on{opacity:1;transform:translateX(-50%)}
.sup{cursor:pointer}

 const items=itemsOf(resp);let shown=items;
 if(!expanded){const lows=items.filter(i=>low(i,vals[i.id]));shown=items.filter(i=>low(i,vals[i.id])||items.indexOf(i)<Math.max(0,8-lows.length)).slice(0,9)}

 supsOf(resp).forEach(s=>{const list=lowFirst(shown.filter(i=>i.sup===s),vals);if(!list.length)return;
  h+=`<div class="zh">${SUP[s].name.toUpperCase()}</div>`;
  list.forEach(i=>{const lw=low(i,vals[i.id]);h+=`<div class="li"><span class="${lw?'warn':''}">${esc(nm(i))}${lw?' ⚠️ '+t('min',i.min).toLowerCase():''}</span><span><b>${fmt(vals[i.id])}</b> ${un(i.unit)}</span></div>`})});
 if(!expanded&&items.length>shown.length)h+=`<hr><span class="muted sm">${t('more_items',items.length-shown.length)}</span>`;
 return h}

// ---------- actions
const UI=new Set(['role','lang','zone','tab','showall','rctog','rcwho','rvtog','rvwho','suptog','supmore','qminus','qplus','sheettab','step','notyet','back','closeapp','openapp','fillex']);
function sendRecount(x,by){const p=S.parts[x],dr=p.draft;const k={id:S.tasks.length,resp:x,by,to:dr.who,items:[...dr.items],comment:dr.comment,status:'open',vals:{},at:now()};S.tasks.push(k);
 p.status='recount';p.rcTo=dr.who;p.chat.stage=null;p.draft=null;W();k.items.forEach(id=>S.count.iseq[id]=S.seq);
 push(rk(x),'rcsent',{to:k.to,n:k.items.length});
 log(by,`Asked ${k.to} to recount ${k.items.length} items (${k.items.map(id=>IT[id].en).join(', ')})${k.comment?': “'+k.comment+'”':''}`);
 if(k.to==='Ana')push('ana','push',{task:k.id});else toast(t('not_emul',k.to))}
function doAccept(x){const p=S.parts[x];const by=me();p.status='accepted';p.accBy=by;p.accAt=now();p.chat.stage=null;W();itemsOf(x).forEach(i=>S.count.iseq[i.id]=S.seq);
 S.tasks.forEach(k=>{if(k.resp===x&&k.status==='open')k.status='cancelled'});
 push(rk(x),'acc',{resp:x});push('ana','accn',{by});log(by,`Accepted the Sunday count (${x}'s part, ${itemsOf(x).length} items)`)}
function openOrder(x){if(!S.orders[x])S.orders[x]={q:{},open:{continente:false,glad:false},more:{}};const o=S.orders[x];if(o.saved){o.q={};Object.entries(o.saved).forEach(([s,l])=>l.forEach(([id,q])=>o.q[s+'|'+id]=q))}
 const r=rk(x);S.role=r;S.view[r]='app';S.app[r].scr='order';S.app[r].arg=x;if(x==='Nazar')S.f.orderOpen=true}
function copyText(x,s){const o=S.orders[x];const lines=o.saved[s].map(([id,q])=>`- ${IT[id].pt}: ${fmt(q).replace('.',',')} ${L.pt['u_'+IT[id].unit]}`);
 const txt=`Olá! Encomenda The Layers (25.10):\n${lines.join('\n')}\nObrigado!`;window.__lastCopy=txt;
 let ok=false;try{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(()=>{});
 S.f.copied=S.f.copied||x==='Nazar';toast(t('copied',SUP[s].name))}
function act(a,arg){
 S.wrote=false;if(!UI.has(a))tick(1);const r=S.role;const A=S.app[r];
 const [x,y]=String(arg||'').split('|');
 switch(a){
 case 'role':S.role=arg;break;
 case 'lang':S.lang=arg;break;
 case 'step':{const ro=STEPS[+arg][0];S.role=ro;const ix=+arg;
  if(ix===2||ix===3||ix===4)S.view.ana=S.ana.status==='approved'?'app':'chat';
  if(ix===7||ix===8)S.view.maryna='app',S.app.maryna.tab='review';break}
 case 'openapp':if(r==='ana'&&S.ana.status!=='approved'){toast(t('noaccess'));break}S.view[r]='app';if(r==='ana')S.f.anaApp=true;break;
 case 'closeapp':S.view[r]='chat';break;
 case 'back':A.scr='home';break;
 case 'tab':A.tab=arg;A.scr='home';break;
 case 'notyet':toast(t('not_today'));break;
 case 'start':S.ana.started=true;push('ana','me',{text:'/start'},true);push('ana','welcome');S.ana.kb=true;break;
 case 'share':S.ana.kb=false;push('ana','contact',{},true);push('ana','thanks');S.ana.status='shared';S.ana.reqId=push('dmytro','newstaff',{}).id;log('Ana Silva','Shared contact, asked for access (+351 9xx xxx 123, @ana)');break;
 case 'approve':case 'reject':{if(S.ana.status!=='shared')break;const m=S.chats.dmytro.find(m=>m.id===S.ana.reqId);m.data.res=a==='approve'?'approved':'rejected';m.data.at=now();
  if(a==='approve'){S.ana.status='approved_pending_role';push('dmytro','pickrole');log('Dmytro','Approved Ana Silva')}
  else{S.ana.status='rejected';push('ana','rejected');S.ana.kb=true;log('Dmytro','Rejected Ana Silva');S.ana.status='new2'}
  if(r==='dmytro'&&S.view.dmytro==='app'&&a==='approve'){S.view.dmytro='chat'}break}
 case 'pickrole':S.ana.role=arg;S.ana.status='approved';S.sheet.staff.push({seq:W(),name:'Ana Silva',phone:'+351 9xx xxx 123',tg:'@ana',role:t('ro_'+arg).replace(/^\S+ /,''),by:'Dmytro',at:'25.10 '+now()});
  push('dmytro','added',{role:arg});push('ana','approved',{role:arg});log('Dmytro',`Set role ${arg} for Ana Silva → Staff tab`);break;
 case 'startcount':if(S.count.status==='none'){S.count.status='draft';S.count.by='Ana'}A.scr='count';break;
 case 'zone':S.count.zone=arg;break;
 case 'fillex':ITEMS.forEach(i=>{if(S.count.vals[i.id]==null)S.count.vals[i.id]=i.ex});break;
 case 'submit':{if(filledN()<ITEMS.length)break;S.count.status='submitted';S.count.at=now();W();ITEMS.forEach(i=>S.count.iseq[i.id]=S.seq);
  RESP.forEach(x=>{S.parts[x]={resp:x,status:'pending',round:1,countedBy:'Ana',chat:{stage:null},draft:null};S.parts[x].lastMsg=push(rk(x),'review',{resp:x,round:1,by:'Ana',vals:{...S.count.vals}}).id});
  push('ana','sentrev');log('Ana',`Submitted the Sunday count (${ITEMS.length} items) → Nazar ${itemsOf('Nazar').length}, Maryna ${itemsOf('Maryna').length}`);A.scr='home';toast(t('sent_toast'));break}
 case 'showall':{const m=S.chats[r].find(m=>m.id==arg);m.expanded=!m.expanded;break}
 case 'accept':doAccept(arg);if(S.view[r]==='app')A.scr='review';break;
 case 'askrc':{const p=S.parts[arg];p.draft={items:new Set(),comment:'',who:p.countedBy};p.chat.stage='items';p.chat.mid=push(r,'rcitems',{resp:arg}).id;break}
 case 'rctog':{const p=S.parts[x];p.draft.items.has(y)?p.draft.items.delete(y):p.draft.items.add(y);break}
 case 'rcnext':{const p=S.parts[arg];if(!p.draft.items.size){toast(t('pick_one'));break}S.chats[r].find(m=>m.id===p.chat.mid).data.sel=[...p.draft.items];p.chat.stage='comment';p.chat.mid=push(r,'rccmt',{resp:arg}).id;break}
 case 'sendcmt':{const p=S.parts[arg];const v=(document.getElementById('chatin')||{}).value||'';if(!v.trim()){toast(t('type_cmt'));break}push(r,'me',{text:v.trim()},true);p.draft.comment=v.trim();p.chat.stage='who';p.chat.mid=push(r,'rcwho',{resp:arg}).id;break}
 case 'skipcmt':{const p=S.parts[arg];p.chat.stage='who';p.chat.mid=push(r,'rcwho',{resp:arg}).id;break}
 case 'rcwho':S.parts[x].draft.who=y;break;
 case 'rcsend':sendRecount(arg,me());break;
 case 'openreview':A.scr='review';A.arg=arg;S.view[r]='app';break;
 case 'rvtog':{const p=S.parts[x];p.draft.items.has(y)?p.draft.items.delete(y):p.draft.items.add(y);break}
 case 'rvwho':S.parts[x].draft.who=y;break;
 case 'rvsend':{const p=S.parts[arg];if(!p.draft.items.size){toast(t('pick_one'));break}sendRecount(arg,me());break}
 case 'openrc':{const k=S.tasks[+arg];if(k.status!=='open')break;S.view.ana='app';S.app.ana.scr='recount';S.app.ana.arg=+arg;S.f.anaRc=true;break}
 case 'resubmit':{const k=S.tasks[+arg];if(k.items.some(id=>k.vals[id]==null))break;W();const changes=k.items.map(id=>[id,S.count.vals[id],k.vals[id]]);
  changes.forEach(([id,f,to])=>{(S.count.hist[id]=S.count.hist[id]||[]).push({from:f,to,by:'Ana',at:now(),ask:k.by});S.count.vals[id]=to;S.count.iseq[id]=S.seq});
  k.status='done';const p=S.parts[k.resp];p.status='pending';p.round++;p.lastMsg=push(rk(k.resp),'review',{resp:k.resp,round:p.round,by:'Ana',changes,vals:{...S.count.vals}}).id;
  push('ana','backsent',{resp:k.resp});log('Ana',`Resubmitted recount for ${k.resp}: ${changes.map(c=>IT[c[0]].en+' '+fmt(c[1])+'→'+fmt(c[2])).join(', ')}`);A.scr='home';break}
 case 'makeorder':{const p=S.parts[arg];if(!p||p.status!=='accepted')break;openOrder(arg);break}
 case 'suptog':{const o=S.orders[x];o.open[y]=o.open[y]===false;break}
 case 'supmore':{const o=S.orders[x];o.more[y]=!o.more[y];break}
 case 'qminus':case 'qplus':{const o=S.orders[x];const k=arg.slice(x.length+1);const v=o.q[k]||0;o.q[k]=a==='qplus'?v+1:Math.max(0,v-1);break}
 case 'saveorder':{const o=S.orders[arg];const snap={};supsOf(arg).forEach(s=>{const l=lowFirst(supItems(s),S.count.vals).filter(i=>o.q[s+'|'+i.id]>0).map(i=>[i.id,o.q[s+'|'+i.id]]);if(l.length)snap[s]=l});
  if(!Object.keys(snap).length){toast(t('nothing_filled'));break}const re=!!o.saved;W();
  S.sheet.orders=S.sheet.orders.filter(row=>row.by!==arg);
  Object.keys(snap).forEach(s=>snap[s].forEach(([id,q])=>S.sheet.orders.push({seq:S.seq,date:'25.10',sup:SUP[s].name,item:IT[id].en,qty:q,unit:IT[id].unit,by:arg,at:'25.10 '+now(),from:'Sun 25.10 (Ana, accepted '+S.parts[arg].accAt+')'})));
  o.saved=snap;o.savedAt=now();o.mid=push(rk(arg),'os',{resp:arg,by:arg,snap}).id;log(arg,`${re?'Updated':'Saved'} order: ${Object.keys(snap).map(s=>SUP[s].name+' '+snap[s].length).join(', ')} (not sent to suppliers)`);
  S.view[r]='chat';A.scr='home';break}
 case 'copy':copyText(x,y);break;
 case 'sheettab':S.sheetTab=arg;break;
 case 'reset':{const l=S.lang;init();S.lang=l;break}
 }render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;act(el.dataset.act,el.dataset.a)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatin'){const b=document.querySelector('[data-act="sendcmt"]');if(b)act('sendcmt',b.dataset.a)}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.cnt){const i=IT[el.dataset.cnt],v=pv(el.value);if(v==null)delete S.count.vals[i.id];else S.count.vals[i.id]=v;el.classList.toggle('red',low(i,v));
  const meta=el.parentNode.querySelector('.meta');if(i.min)meta.innerHTML=`${un(i.unit)} · <span class="${low(i,v)?'low':'min'}">${t('min',i.min)}${low(i,v)?' · '+t('below'):''}</span>`;
  document.getElementById('ctabs').innerHTML=countTabs();document.getElementById('cfoot').innerHTML=countFoot()}
 if(el.dataset.rc){const [ix,id]=el.dataset.rc.split('|');const k=S.tasks[+ix],v=pv(el.value);if(v==null)delete k.vals[id];else k.vals[id]=v;el.classList.toggle('red',low(IT[id],v));document.getElementById('rcfoot').innerHTML=rcFoot(k)}
 if(el.dataset.q){const [x,s,id]=el.dataset.q.split('|');const v=pv(el.value);S.orders[x].q[s+'|'+id]=v||0;document.getElementById('ofoot').innerHTML=oFoot(x)}
 if(el.id==='rvcomment'){const p=S.parts[el.dataset.a];if(p.draft)p.draft.comment=el.value}});
window.addEventListener('error',e=>{(window.__errors=window.__errors||[]).push(String(e.message))});
render();

</script></body></html>
